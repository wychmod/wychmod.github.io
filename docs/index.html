<!-- Mermaid 本体: 以动态 import 加载 ESM, 就绪后写入 window.__mermaidReady;
     插件(docsify-mermaid)在 doneEach 等待该 Promise, 消除 module(异步) 与
     普通 script(同步执行) 之间的加载竞态 —— 否则 mermaid.run 可能尚未定义。
     主题沿用原 Notion editorial 配色(原先写在 $docsify.mermaid, 该键实际无人读取)。 -->
<script>
  /* Mermaid 本体按需加载: 只有页面真的含 .mermaid 容器时才会 import 这个 ESM 包
     (约 1MB), 首页 / 工具页 / 无图文档因此完全省掉这一笔下载。
     window.__loadMermaid() 幂等 —— 同一会话只 import 一次并缓存 Promise;
     docsify-mermaid 的 doneEach 调用它并 await, 消除 module(异步) 与
     普通 script 之间的加载竞态(否则 mermaid.run 可能尚未定义)。
     主题沿用原 Notion editorial 配色(原先写在 $docsify.mermaid, 该键实际无人读取)。 */
  (function () {
    var ready = null;
    window.__loadMermaid = function () {
      if (ready) return ready;
      ready = import("https://registry.npmmirror.com/mermaid/10.9.3/files/dist/mermaid.esm.min.mjs")
        .then(function (m) {
          window.mermaid = m.default;
          window.mermaid.initialize({
            startOnLoad: false,  /* 交给 docsify-mermaid 在 doneEach 显式 run, 避免重复渲染 */
            theme: 'base',
            themeVariables: {
              primaryColor: '#f1ecff',
              primaryTextColor: '#37352f',
              primaryBorderColor: '#6d4aff',
              lineColor: '#6d4aff',
              secondaryColor: '#fff7cf',
              tertiaryColor: '#eaf8ef'
            },
            flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }
          });
          return window.mermaid;
        })
        .catch(function (err) {
          console.error('[mermaid] 本体加载失败', err);
          ready = null;   /* 失败不缓存, 允许下次路由重试 */
        });
      return ready;
    };
  })();
</script>
